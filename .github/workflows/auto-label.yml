name: Auto-label AM or AppMan

on:
  issues:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Apply Label based on form selection
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            let labelsToAdd = [];

            // Using Regex handles invisible \r\n carriage returns gracefully.
            // Match handles BOTH Checkboxes ("- [X] AM") and Dropdowns ("...AppMan"? \n\n AM)
            const isAM = /- \[[xX]\] AM/.test(body) || /### Are you using "AM" or "AppMan"\?\s+AM/.test(body);
            const isAppMan = /- \[[xX]\] AppMan/.test(body) || /### Are you using "AM" or "AppMan"\?\s+AppMan/.test(body);

            if (isAM) labelsToAdd.push('AM');
            if (isAppMan) labelsToAdd.push('AppMan');

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labelsToAdd
              });
            }
